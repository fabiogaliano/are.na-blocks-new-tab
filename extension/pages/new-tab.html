<!DOCTYPE html>
<html lang="en" data-page-state="booting">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>are.na blocks new tab</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script type="module" src="../scripts/new-tab.js" defer></script>
</head>
<body data-page="new-tab">
    <div id="app-shell">
        <header id="header-bar" aria-label="Top bar" hidden>
            <div class="bar-region bar-region--left" id="top-bar-left"></div>
            <div class="bar-region bar-region--right" id="top-bar-right"></div>
        </header>

        <main id="content-area">
            <section id="blocks-view" class="new-tab-view">
                <div id="blocks-container" aria-live="polite"></div>
            </section>
            <section id="bookmarks-view" class="new-tab-view" hidden>
                <header id="bm-toolbar">
                    <button class="button" id="bm-back-blocks" type="button">← blocks</button>
                    <span id="bm-summary" aria-live="polite"></span>
                    <div class="bm-toolbar-actions">
                        <button class="button" id="bm-add-root-folder" type="button" hidden>＋ folder</button>
                        <button class="button" id="bm-search" type="button">search <span class="key-hint">/</span></button>
                        <button class="button" id="bm-manage" type="button">manage</button>
                    </div>
                </header>
                <div id="bm-manage-note" hidden>
                    manage · <span id="bm-manage-count">0 changes</span> · drag to move, click a title to rename, ✕ to delete. Nothing is written until you press done. Changes are lost if you close this tab.
                    <button class="button" id="bm-manage-cancel" type="button">cancel</button>
                    <button class="button" id="bm-manage-done" type="button">done</button>
                    <div id="bm-manage-errors" hidden></div>
                </div>
                <div id="bm-stack">
                    <section class="bm-card-surface is-front" id="bm-card-main" aria-label="Day to day bookmarks">
                        <header class="bm-card-bar">
                            <span class="bm-card-title">main — day to day</span>
                            <span class="bm-card-meta" id="bm-main-meta"></span>
                        </header>
                        <div class="bm-card-scroll">
                            <div id="bm-pinned"></div>
                            <h2 class="bm-section-title">everything else — <span class="bm-breadcrumb" id="bm-main-crumb"></span></h2>
                            <div class="bm-columns" id="bm-main-columns"></div>
                        </div>
                    </section>
                    <section class="bm-card-surface is-back" id="bm-card-archive" aria-label="Archived bookmarks">
                        <header class="bm-card-bar">
                            <span class="bm-card-title">archive — <span class="bm-breadcrumb" id="bm-archive-crumb"></span></span>
                            <span class="bm-card-meta" id="bm-archive-meta"></span>
                        </header>
                        <div class="bm-card-scroll bm-card-scroll--flush">
                            <div class="bm-columns" id="bm-archive-columns"></div>
                        </div>
                    </section>
                </div>
                <div id="bm-board" hidden></div>
            </section>
        </main>

        <footer id="footer-bar" aria-label="Bottom bar" hidden>
            <div class="bar-region bar-region--left" id="bottom-bar-left"></div>
            <div class="bar-region bar-region--right" id="bottom-bar-right"></div>
        </footer>
    </div>

    <div id="bar-component-pool" hidden>
        <div class="bar-component bar-component--bookmarks" id="bookmark-strip" data-state="loading" aria-live="polite">
            <div class="view-toggle" role="group" aria-label="New tab view">
                <button id="view-blocks" type="button" aria-pressed="true">blocks</button>
                <button id="view-bookmarks" type="button" aria-pressed="false">bookmarks <span class="bookmark-new-badge" id="bookmark-new-count" hidden></span></button>
            </div>
            <span class="key-hint" aria-hidden="true">b</span>
            <div id="launch-chips" aria-label="Launch bookmarks"></div>
        </div>
        <time class="bar-component bar-text-component" id="bar-date" title="Current date"></time>
        <time class="bar-component bar-text-component" id="bar-time" title="Current time"></time>
        <time class="bar-component bar-text-component" id="bar-date-time" title="Current date and time"></time>
        <div class="bar-component bar-component--cache">
            <button class="button status-button" id="cache-status-button" type="button">
                <span id="cache-label">Cache idle</span>
            </button>
        </div>
        <div class="bar-component bar-component--settings">
            <a id="open-settings" class="button" href="../pages/settings.html" title="Open settings" target="_blank" rel="noopener">Settings</a>
        </div>
    </div>

    <div id="bm-selection-bar" hidden>
        <span id="bm-selection-count">0 selected</span>
        <button class="button" id="bm-open-selection" type="button">open ↗</button>
        <button class="button" id="bm-move-selection" type="button">move to…</button>
        <button class="button" id="bm-delete-selection" type="button">delete</button>
        <button class="button" id="bm-clear-selection" type="button">clear</button>
    </div>
    <div id="bm-palette" hidden>
        <div class="bm-palette-panel">
            <input id="bm-palette-query" type="text" autocomplete="off" />
            <div class="bm-palette-columns">
                <nav id="bm-palette-folders" aria-label="Bookmark folders"></nav>
                <div class="bm-palette-main">
                    <div id="bm-palette-filters">
                        <button class="button is-active" data-filter="all" type="button">all</button>
                        <button class="button" data-filter="new" type="button">new</button>
                    </div>
                    <div id="bm-palette-results"></div>
                </div>
            </div>
        </div>
    </div>

    <template id="block-card-template">
        <article class="block-card">
            <div class="block-main" data-main></div>
            <div class="block-info">
                <h2 class="block-title"></h2>
                <p class="block-description"></p>
                <div class="block-meta-row" data-meta></div>
            </div>
        </article>
    </template>
    <template id="bm-card-template"><section class="bm-card"></section></template>
    <template id="bm-group-template"><section class="bm-group"></section></template>
    <template id="bm-row-template"><a class="bm-row" target="_blank" rel="noopener"></a></template>
</body>
</html>
